<!-- @dsCard group="Componentes" title="Tienda" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tienda · Aprendiz en Apuros UI</title>
<style>
/* ══════════════════════════════════════════════
   TIPOGRAFÍAS AUTOALOJADAS
   Estaban en Google Fonts y eran el ÚNICO recurso
   externo que quedaba: en la primera visita sin
   internet el service worker no las tenía en
   caché y el juego caía a Courier New. Ahora
   viajan en el repo (11,9 KB las dos, subconjunto
   latino — el acentuado español entra entero en
   U+0000-00FF) y el juego no habla con nadie.
   ══════════════════════════════════════════════ */
@font-face{
  font-family:'Press Start 2P';
  font-style:normal;font-weight:400;font-display:swap;
  src:url('../../../fuentes/press-start-2p.woff2') format('woff2');
}
@font-face{
  font-family:'VT323';
  font-style:normal;font-weight:400;font-display:swap;
  src:url('../../../fuentes/vt323.woff2') format('woff2');
}
/* ══════════════════════════════════════════════
   TOKENS · RETRO LIMPIO Y LEGIBLE
   Verde SENA protagonista · alto contraste
   ══════════════════════════════════════════════ */
:root{
  --void:#0e1120; --void2:#11152a; --pan:#181d36; --pan2:#1f2542; --pan3:#262d52;
  --g0:#1c5400; --g1:#2e7a10; --g2:#39a900; --g3:#54c41a; --g4:#8aff4f;
  --y1:#b88a00; --y2:#ffcf3f; --y3:#ffe27a; --y4:#fff3c4;
  --v0:#241048; --v1:#5a1bb0; --v2:#8c3df0; --v3:#a86bff; --v4:#d9c2ff;
  --o1:#a04000; --o2:#e06020; --o3:#ff8c44; --o4:#ffbf94;
  --b1:#0c3550; --b2:#13648c; --b3:#1ea0c8; --b4:#6fd2f0;
  --r1:#6e1224; --r2:#c22e44; --r3:#ff5468; --r4:#ff9aa6;
  /* --tx1 se subió de #55608f (2.73:1 sobre el panel, suspendía WCAG AA)
     a #7f8dc0 (5.11:1). Lo usan las pistas de logros, las estrellas vacías,
     la lista de rangos y las piezas de SQL: texto que hay que poder leer. */
  --tx1:#7f8dc0; --tx2:#9fb0d8; --tx3:#cdd8f6; --tx4:#f2f5ff;
  --bl:#39426e; --bd:#07080f;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
/* Foco de teclado visible en TODO lo que se pueda enfocar. Sin esto, quien
   navega con el tabulador no tiene forma de saber dónde está. Se usa
   :focus-visible y no :focus para que el ratón no pinte el contorno. */
:focus-visible{outline:3px solid var(--y2);outline-offset:2px}
/* Los botones que el juego dibuja heredan la tipografía y el color del
   juego: antes eran <div> y el navegador no les imponía nada. */
button{font-family:inherit;color:inherit}
html,body{height:100%;overflow:hidden}
body{
  background:var(--void);
  font-family:'Press Start 2P','Courier New',monospace;
  color:var(--tx4);
  display:flex;align-items:center;justify-content:center;
  /* En un iPhone con muesca y la PWA instalada, un padding fijo deja el HUD
     debajo del notch. Se respeta el área segura sin bajar de los 6px. */
  padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right))
          max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));
  touch-action:manipulation;
}
.crt{position:fixed;inset:0;pointer-events:none;z-index:60;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.06)0 1px,transparent 1px 3px);}
.crt::after{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at center,transparent 62%,rgba(0,0,10,.35)100%);}
#app{
  width:min(600px,100%);
  height:calc(100dvh - 12px);
  max-height:880px;
  background:var(--pan);
  border:3px solid var(--bl);
  box-shadow:0 0 0 2px var(--bd),0 8px 0 rgba(0,0,0,.45),
    inset 0 2px 0 rgba(255,255,255,.05);
  padding:10px;display:flex;flex-direction:column;gap:10px;
  position:relative;
}
/* Con JS (siempre que hay juego), encajar() mide la pantalla y fija el marco
   en px lógicos más un zoom que lo hace crecer entero en pantallas grandes.
   Lo de arriba queda como respaldo para el primer instante. */
html.encaje #app{zoom:var(--esc,1);width:var(--app-w);height:var(--app-h);max-height:none}
/* ══════════════════════════════════════════════
   FONDO · montañas pixeladas, sin imágenes
   Polígonos escalonados para que el borde tenga
   el "escalón" del pixel art en vez de una
   diagonal suave.
   ══════════════════════════════════════════════ */
#fondo{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,#070a1a 0%,#0a1028 45%,#0c1433 100%)}
.mte{position:absolute;left:-10%;width:120%;bottom:0;background:var(--c);
  clip-path:polygon(
    0% 100%,0% 62%,4% 62%,4% 54%,8% 54%,8% 46%,12% 46%,12% 38%,16% 38%,16% 30%,
    20% 30%,20% 38%,24% 38%,24% 46%,28% 46%,28% 54%,32% 54%,32% 46%,36% 46%,
    36% 34%,40% 34%,40% 22%,44% 22%,44% 14%,48% 14%,48% 22%,52% 22%,52% 34%,
    56% 34%,56% 44%,60% 44%,60% 52%,64% 52%,64% 42%,68% 42%,68% 32%,72% 32%,
    72% 24%,76% 24%,76% 34%,80% 34%,80% 44%,84% 44%,84% 54%,88% 54%,88% 62%,
    92% 62%,92% 70%,96% 70%,96% 62%,100% 62%,100% 100%)}
.mte.m3{height:74%;--c:#1d2a5e;opacity:.9;animation:derivaLenta 46s ease-in-out infinite alternate}
.mte.m2{height:58%;--c:#16204d;opacity:.95;animation:derivaLenta 34s ease-in-out infinite alternate-reverse}
.mte.m1{height:42%;--c:#101839;animation:derivaLenta 26s ease-in-out infinite alternate}
.niebla{position:absolute;inset:0;
  background:radial-gradient(120% 90% at 50% 0%,rgba(57,169,0,.07) 0%,transparent 55%),
             linear-gradient(180deg,rgba(11,15,36,.55) 0%,transparent 35%,rgba(8,10,22,.5) 100%)}
@keyframes derivaLenta{from{transform:translateX(-1.5%)}to{transform:translateX(1.5%)}}

/* el contenido va por encima del fondo */
#hud,#screen,#pausa,#logro-popup,#interrupcion{position:relative;z-index:1}

/* ── esquinas del marco, como en una consola ── */
#app::before,#app::after{content:'';position:absolute;width:18px;height:18px;
  border:3px solid var(--g2);pointer-events:none;z-index:2}
#app::before{top:4px;left:4px;border-right:0;border-bottom:0}
#app::after{bottom:4px;right:4px;border-left:0;border-top:0}

#hud{
  display:flex;align-items:center;gap:8px;font-size:10px;
  border-bottom:3px solid var(--g2);padding-bottom:10px;
}
#h-nivel{color:var(--g3);letter-spacing:1px;flex:0 0 auto}
#h-nivel .h-lbl{margin-right:5px}
/* min-width:0 para que pueda encogerse, y overflow:hidden como red: si algún
   día el contenido no cupiera, se recorta en vez de pisar al vecino — que es
   lo que pasaba en la portada, con los puntos escritos encima del nivel. */
#h-estrellas{flex:1;font-size:12px;letter-spacing:2px;color:var(--y2);text-align:center;
  min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#h-pts{color:var(--y2);letter-spacing:1px;flex:0 0 auto}
#h-vidas{color:var(--r3);font-size:12px;flex:0 0 auto}
.b-sys{
  font-family:inherit;font-size:11px;min-width:44px;min-height:44px;
  background:var(--void2);cursor:pointer;position:relative;
  border:2px solid var(--bl);
  box-shadow:0 2px 0 var(--bd);
}
/* ── HUD en pantallas estrechas ──
   Con la tipografía real (no el Courier de respaldo), las siete piezas del HUD
   pedían 397 px en una caja de 322: la fila desbordaba en cualquier móvil, y
   subir los botones a 44 px lo empeoró. Aquí se aprieta lo que no es dato:
   desaparece la palabra "DÍA", baja el interletrado y los botones vuelven a
   38 px de ancho — pero su ZONA TÁCTIL sigue siendo de 44, estirada con un
   ::after que no ocupa sitio en el diseño. El hueco de 6 px entre botones es
   mayor que los 3 px que sobresale cada lado, así que no se pisan. */
@media (max-width:470px){
  #hud{gap:2px}
  #h-nivel{letter-spacing:0}
  #h-nivel .h-lbl{display:none}
  #h-estrellas{font-size:10px;letter-spacing:0}
  #h-pts{letter-spacing:0}
  #h-vidas{font-size:11px}
  /* 42×44 px reales. Se probó estirar la zona táctil con un ::after sobre un
     botón de 38 px y NO funciona: el navegador no la cuenta como parte del
     botón. Así que el ancho es de verdad, y el hueco baja a 2 px para que la
     fila siga cabiendo en 322 px con la tipografía real. */
  .b-sys{min-width:42px;font-size:10px}
  /* En la portada, "LVL n" sobra: la barra de XP de al lado ya dice lo mismo y
     el rango va con su nombre completo en el cuerpo de la pantalla. */
  .hud-titulo #h-pts{display:none}
}
.b-lang{color:var(--y2)} .b-snd{color:var(--b4)} .b-pause{color:var(--tx3)}
.b-sys:active{transform:translateY(2px);box-shadow:none}
#screen{flex:1;display:flex;min-height:0;overflow:auto}
#screen>*{margin:auto;width:100%;animation:aparecer .25s ease-out}
.overlay{
  position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:rgba(10,12,24,.92);
}
#pausa{z-index:55!important;touch-action:auto}
#pausa .menu-inner{
  display:flex;flex-direction:column;gap:14px;align-items:center;width:min(320px,90%);
  background:var(--pan2);
  border:3px solid var(--g2);box-shadow:0 0 0 2px var(--bd),0 6px 0 rgba(0,0,0,.4);
  padding:26px 20px;pointer-events:all;
}
#logro-popup{
  position:absolute;bottom:74px;left:50%;transform:translateX(-50%);z-index:30;
  background:var(--pan3);
  border:2px solid var(--v3);box-shadow:0 0 0 2px var(--bd),0 4px 0 rgba(0,0,0,.4);
  padding:12px 18px;display:flex;gap:12px;align-items:center;
  animation:logro-entra .35s ease-out;pointer-events:none;
}
#logro-popup .ico-l{font-size:24px;line-height:1}
#logro-popup p{font-size:9px;color:var(--v4);line-height:1.8}
#interrupcion{
  position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:30;
  background:var(--r1);
  border:2px solid var(--r3);box-shadow:0 0 0 2px var(--bd),0 4px 0 rgba(0,0,0,.4);
  padding:14px 22px;text-align:center;white-space:nowrap;
  animation:aparece-int .25s ease-out;
}
#interrupcion p{font-size:10px;color:var(--r4);letter-spacing:1px}
.centro{display:flex;flex-direction:column;align-items:center;gap:14px;
  text-align:center;padding:10px 6px;}
.logo-px{font-size:9px;color:var(--g3);border:2px solid var(--bl);
  background:var(--void2);padding:8px 12px;letter-spacing:2px}
h1{font-size:clamp(18px,5.6vw,26px);line-height:1.55;color:var(--y2);
  text-shadow:3px 3px 0 var(--g0)}
h2{font-size:clamp(13px,4.4vw,20px);line-height:1.55;color:var(--y2);
  text-shadow:2px 2px 0 var(--bd)}
/* Encabezado de sección con líneas a los lados. Al estilarlo en el propio h3,
   todas las pantallas (tienda, récords, avatar, reto, estadísticas) quedan
   coherentes con la portada sin tocar su HTML. */
h3{font-size:11px;color:var(--g3);letter-spacing:2px;
  display:flex;align-items:center;gap:12px;justify-content:center;
  width:min(440px,100%);text-align:center}
h3::before,h3::after{content:'';flex:1;height:2px;background:var(--bl);min-width:14px}
.verde{color:var(--g4)} .rojo{color:var(--r3)} .violeta{color:var(--v3)} .azul{color:var(--b4)}
.sub{font-size:9px;color:var(--tx2);line-height:2;letter-spacing:1px}
.mini{font-family:'VT323',monospace;font-size:18px;color:var(--tx2);line-height:1.4}
.desc{font-family:'VT323',monospace;font-size:20px;line-height:1.45;max-width:460px;color:var(--tx3)}
.dia{font-size:9px;color:var(--g3);letter-spacing:2px}
.modo{font-size:9px;color:var(--b4);background:var(--void2);
  border:2px solid var(--bl);padding:8px 13px}
.ico{font-size:46px;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.45))}
.pts-final{font-size:14px;color:var(--y2);text-shadow:2px 2px 0 var(--g0)}
.rango{font-size:30px;color:var(--g4);text-shadow:3px 3px 0 var(--g0)}
.blink{animation:blink 1s steps(2) infinite}
.stars-row{font-size:14px;letter-spacing:2px}
.stars-row .on{color:var(--y2)} .stars-row .off{color:var(--tx1)}
.btn{
  font-family:inherit;font-size:12px;color:#fff;cursor:pointer;letter-spacing:1px;
  padding:15px 22px;min-height:48px;border:2px solid var(--bd);
  background:var(--g2);
  box-shadow:inset 0 3px 0 var(--g4),inset 0 -3px 0 var(--g0),0 4px 0 var(--bd);
  text-shadow:1px 1px 0 var(--g0);
}
.btn:active{transform:translateY(4px);box-shadow:inset 0 3px 0 var(--g4),inset 0 -3px 0 var(--g0)}
.btn2{background:#2c3460;
  box-shadow:inset 0 3px 0 #4a548e,inset 0 -3px 0 #161b38,0 4px 0 var(--bd);
  text-shadow:1px 1px 0 #161b38}
.btn2:active{transform:translateY(4px);box-shadow:inset 0 3px 0 #4a548e,inset 0 -3px 0 #161b38}
.btn3{background:var(--v2);
  box-shadow:inset 0 3px 0 var(--v3),inset 0 -3px 0 var(--v0),0 4px 0 var(--bd);
  text-shadow:1px 1px 0 var(--v0)}
.btn3:active{transform:translateY(4px);box-shadow:inset 0 3px 0 var(--v3),inset 0 -3px 0 var(--v0)}
.btn-ico{padding:12px 16px;font-size:15px}
.dialogo{display:flex;gap:12px;width:min(460px,100%);text-align:left;
  background:var(--pan2);
  padding:13px;border:2px solid var(--g1);
  box-shadow:0 0 0 2px var(--bd),0 4px 0 rgba(0,0,0,.4);}
.retrato-wrap{width:68px;height:68px;flex:0 0 68px;position:relative;overflow:hidden}
canvas.retrato{width:68px;height:68px;image-rendering:pixelated;
  border:2px solid var(--bd);background:#0b0e22}
.hablante{font-size:9px;color:var(--g3);letter-spacing:1px;margin-bottom:8px}
.linea{font-family:'VT323',monospace;font-size:21px;line-height:1.35;color:var(--tx4)}
.cert{border:3px dashed var(--g2);padding:18px 14px;
  display:flex;width:min(440px,100%);flex-direction:column;gap:12px;
  background:rgba(57,169,0,.06);align-items:center}
.rec-tabla{width:min(450px,100%);border-collapse:collapse}
.rec-tabla th{font-size:8px;color:var(--g3);padding:8px;border-bottom:2px solid var(--g1)}
.rec-tabla td{font-family:'VT323',monospace;font-size:18px;padding:7px 8px;
  border-bottom:1px solid var(--bl);color:var(--tx3)}
.rec-tabla tr.yo td{color:var(--y2)}
.rec-ico{margin-right:6px}
/* ── Reto diario ── */
.punto-nuevo{color:var(--y2);animation:blink 1s steps(2) infinite}
.reto-racha{display:flex;align-items:center;gap:14px;justify-content:center;
  background:var(--void2);border:3px solid var(--bl);box-shadow:0 4px 0 var(--bd);
  padding:14px 18px;width:min(340px,100%)}
.reto-llama{font-size:34px;filter:grayscale(1);opacity:.45}
.reto-llama.viva{filter:none;opacity:1}
.reto-num{font-size:22px;color:var(--y2);line-height:1.2}
.reto-mult{margin-left:auto;font-size:12px;color:var(--g3)}
.reto-premios{display:flex;gap:10px;font-size:26px;justify-content:center}
.reto-tipos{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:min(400px,100%)}
.reto-chip{font-size:7px;letter-spacing:1px;line-height:1.6;color:var(--tx2);
  background:var(--void2);border:2px solid var(--bl);padding:7px 9px}
/* Filtros de dificultad del marcador global */
.rec-filtros{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
  width:min(450px,100%);margin-bottom:12px}
.rec-chip{font-family:inherit;font-size:7px;letter-spacing:1px;line-height:1.6;
  color:var(--tx2);background:var(--void2);border:2px solid var(--bl);
  box-shadow:0 2px 0 var(--bd);padding:7px 9px;cursor:pointer}
.rec-chip:active{transform:translateY(2px);box-shadow:none}
.rec-chip.act{color:var(--g3);border-color:var(--g2);background:var(--g0)}
.tienda-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:min(430px,100%)}
.item-tienda{display:flex;flex-direction:column;gap:8px;align-items:center;
  background:var(--void2);border:2px solid var(--bl);box-shadow:0 3px 0 var(--bd);
  padding:14px 8px;cursor:pointer}
.item-tienda:active{transform:translateY(3px);box-shadow:none}
.item-tienda .ico-t{font-size:30px}
.item-tienda .nom-t{font-size:8px;color:var(--tx3);text-align:center;line-height:1.7}
.item-tienda .precio{font-size:10px;color:var(--y2)}
.item-tienda.sin-pts{opacity:.35;pointer-events:none}
/* A 320 px la columna mide 83 y "✔ EQUIPADO" a 10 px pedía 116: con `1fr`
   la rejilla crecía y la tercera columna se salía de la pantalla. Aquí
   minmax(0,1fr) topa la columna y se aprieta lo de dentro para que quepa
   sin partir palabras (AUDÍFONOS pide 80). */
@media (max-width:360px){
  .tienda-grid{gap:7px}
  .tienda-grid .item-tienda{padding:12px 4px}
  .tienda-grid .precio{font-size:8px}
}
.item-tienda .nom-t{overflow-wrap:break-word;max-width:100%}
/* `1fr` no baja del ancho mínimo del contenido, así que un nombre largo
   (COLECCIONISTA, MODO PESADILLA) ensanchaba su columna y con ella la rejilla
   entera. minmax(0,1fr) sí encoge.
   Dos columnas hasta 470 px: con tres, un nombre como COLECCIONISTA necesita
   139 px y la columna se queda en 121, así que se partía a mitad de palabra
   ("SIN CONFLICTO / S"). El overflow-wrap de abajo queda solo como última red. */
.logros-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:min(450px,100%)}
@media (min-width:471px){
  .logros-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
.logro{display:flex;flex-direction:column;align-items:center;gap:6px;
  background:var(--void2);border:2px solid var(--bl);padding:11px 5px;text-align:center}
.logro.on{border-color:var(--v3);background:var(--pan3)}
.logro .ico-lg{font-size:22px;filter:grayscale(1);opacity:.3}
.logro.on .ico-lg{filter:none;opacity:1}
.logro p{font-size:9px;color:var(--tx2);line-height:1.6;overflow-wrap:anywhere}
.logro.on p{color:var(--v4)}
/* Pista del logro que aún no tienes: cómo se consigue. */
.logro .pista{font-size:8px;color:var(--tx1);line-height:1.7;letter-spacing:0}
/* ── ficha de controles ── */
.ayuda-lista{list-style:none;display:flex;flex-direction:column;gap:12px;
  width:min(440px,100%);text-align:left;background:var(--void2);
  border:2px solid var(--bl);box-shadow:0 4px 0 var(--bd);padding:16px 14px}
.ayuda-lista li{font-family:'VT323',monospace;font-size:19px;line-height:1.3;
  color:var(--tx3);display:flex;gap:10px;align-items:flex-start}
.ayuda-lista li::before{content:'▸';color:var(--g3);flex:0 0 auto;line-height:1.3}
/* ── código de aula en el marcador ── */
.grupo-barra{display:flex;gap:8px;align-items:center;justify-content:center;
  flex-wrap:wrap;width:min(440px,100%)}
.grupo-cod{font-size:9px;letter-spacing:1px;color:var(--y2);background:var(--void2);
  border:2px solid var(--y1);padding:7px 10px}
.grupo-vacio{font-family:'VT323',monospace;font-size:17px;color:var(--tx1)}
/* ══════════ PANTALLA DE AVATAR ══════════
   Dos columnas dentro del marco: el personaje manda a la izquierda y la
   personalización va a la derecha. #app está topado en 600px a propósito
   —es un marco de consola centrado, no un diseño que se quedó corto— así
   que las columnas se reparten esos 600 y por debajo de 560 se apilan.
   El corte es 560 y no 520 porque justo en 520 la columna derecha se
   quedaba en ~300px y ACCESORIO se partía en dos líneas. */
/* El panel se centra con el #screen>*{margin:auto} de siempre, como las
   demás pantallas. Probé a estirarlo al alto completo para aprovechar la
   franja vacía y quedó peor: la caja del avatar se volvía un rectángulo
   enorme con el muñeco flotando dentro y la columna derecha hueca. El
   avatar se hace protagonista creciendo él, no estirando su caja. */
.pe-wrap{display:flex;flex-direction:column;gap:12px;padding:8px 4px;width:100%}
.pe-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pe-cab h2{margin:0}
.pe-cuerpo{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:stretch}
@media(min-width:560px){.pe-cuerpo{grid-template-columns:minmax(0,205px) minmax(0,1fr)}}

/* ── el personaje ── */
.pe-lado{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  padding:12px 8px;border:2px solid var(--bl);background:var(--void2)}
.pe-cap{font-size:8px;color:var(--g3);letter-spacing:2px;margin:0}
/* El brillo va detrás del lienzo, no encima: un filtro sobre el canvas
   emborronaría los píxeles, que es justo lo contrario de lo que se busca. */
.pe-escena{position:relative;display:grid;place-items:center;width:100%;
  padding:14px 0;border:2px solid var(--bl);background:
    radial-gradient(circle at 50% 45%,rgba(86,131,224,.30),transparent 68%),var(--bd)}
.pe-av{width:min(168px,86%);height:auto;aspect-ratio:1;image-rendering:pixelated;position:relative;z-index:1;
  animation:pe-flota 3s ease-in-out infinite}
@keyframes pe-flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
/* Golpecito al cambiar algo: confirma que el cambio se aplicó al muñeco. */
.pe-pum{animation:pe-pum .28s steps(3,end)}
@keyframes pe-pum{0%{transform:scale(1)}45%{transform:scale(1.09)}100%{transform:scale(1)}}
/* 16 de siempre / 32 más fino. Reusa .rec-chip (la píldora de los filtros
   del marcador): mismo look, sin CSS nuevo por duplicar. */
.pe-detalle{display:flex;gap:6px}
.pe-nombre{font-size:11px;color:var(--tx0);margin:4px 0 0;word-break:break-word}
.pe-rango{font-size:8px;color:var(--y2);margin:0}
.pe-stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:6px 0 0}
.pe-stats>div{display:flex;align-items:center;gap:4px}
.pe-stats dt{font-size:11px}
.pe-stats dd{margin:0;font-size:8px;color:var(--tx1)}

/* ── pestañas ── */
.pe-custom{display:flex;flex-direction:column;gap:12px;min-width:0}
.pe-tabs{display:flex;border-bottom:2px solid var(--bl)}
.pe-tab{flex:1;min-width:0;padding:10px 4px;background:none;border:0;cursor:pointer;
  font-family:inherit;font-size:8px;letter-spacing:1px;color:var(--tx1);
  overflow-wrap:break-word}
.pe-tab:hover{color:var(--tx0);background:rgba(54,76,140,.22)}
.pe-tab.act{color:var(--g3);background:var(--void2);box-shadow:inset 0 -3px 0 var(--g3)}
.pe-panel{min-height:120px}

/* ── inventario ── */
.acc-op.comprado{border-color:var(--bl2,#3a4a80)}
.acc-op.bloq{opacity:.78}
.pe-confirma{border:2px solid var(--y2);background:var(--void2);padding:10px;margin-top:14px}
.pe-confirma p{font-size:8px;margin:0 0 9px;line-height:1.6}
.pe-confirma-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pe-confirma-btns .btn{flex:1 1 110px;font-size:8px;padding:9px 6px}

/* ── pie: el VOLVER forma parte de la navegación, no flota suelto ── */
.pe-pie{display:flex;align-items:center;justify-content:space-between;gap:10px;
  flex-wrap:wrap;margin-top:auto;padding-top:12px;border-top:2px solid var(--bl)}
.pe-estado{font-size:7px;color:var(--tx1);letter-spacing:1px;flex:1 1 120px;text-align:left}
.pe-estado.verde{color:var(--g3)}
.pe-estado.rojo{color:#ff7d8c}
.pe-volver{flex:0 0 auto}
html.legible .pe-tab,html.legible .pe-estado,html.legible .pe-cap,
html.legible .pe-rango,html.legible .pe-stats dd,html.legible .pe-confirma p{
  font-family:'VT323',monospace;letter-spacing:0;font-size:15px}
html.legible .pe-nombre{font-family:'VT323',monospace;font-size:19px}
@media(prefers-reduced-motion:reduce){.pe-av,.pe-pum{animation:none}}

.custom-fila{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
/* ══════════════════════════════════════════════
   PORTADA
   ══════════════════════════════════════════════ */
/* barra superior propia del título: identidad, puntos y nivel */
.hud-xp{display:inline-block;width:62px;height:8px;background:var(--void2);
  border:2px solid var(--bd);vertical-align:middle}
.hud-xp i{display:block;height:100%;background:var(--g3);box-shadow:inset 0 2px 0 var(--g4);
  transition:width .6s ease-out}

/* logo con guiones decorativos a los lados, como en las portadas de arcade */
.tit-logo{display:flex;align-items:center;gap:10px;width:100%;justify-content:center;
  margin-top:4px;min-width:0}
/* El título no podía encogerse y empujaba los guiones decorativos fuera de
   la caja. En pantallas muy estrechas los guiones se van: son adorno. */
.tit-logo .tit-h1{min-width:0}
.tit-logo .guion{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;opacity:.85}
.tit-logo .guion i{display:block;height:4px;background:var(--g3)}
.tit-logo .guion i:nth-child(1){width:26px}
.tit-logo .guion i:nth-child(2){width:16px;background:var(--v3);margin-left:auto}
.tit-logo .guion i:nth-child(3){width:34px;background:var(--y2)}
.tit-logo .guion.der i:nth-child(1){margin-left:auto}
.tit-logo .guion.der i:nth-child(2){margin-left:0}
.tit-logo .guion.der i:nth-child(3){margin-left:auto}

.tit-h1{font-size:clamp(19px,6.2vw,30px);line-height:1.28;letter-spacing:1px;text-align:center}
.tit-h1 .l1{color:var(--y2);text-shadow:3px 3px 0 var(--o1),4px 5px 0 var(--bd),0 0 24px rgba(255,207,63,.3)}
.tit-h1 .l2{color:var(--g4);text-shadow:3px 3px 0 var(--g0),4px 5px 0 var(--bd),0 0 24px rgba(138,255,79,.3)}
.tit-h1 .n4{display:inline-block;color:var(--v4);background:var(--v1);
  border:3px solid var(--v3);padding:2px 9px;margin-left:8px;
  text-shadow:2px 2px 0 var(--v0);box-shadow:0 4px 0 var(--bd),0 0 18px rgba(168,107,255,.35)}

/* píldora de identidad: rango y puntos en una sola pieza con divisor */
/* La píldora del mapa lleva TRES tramos (rango, dificultad, puntos) y con la
   tipografía real no caben en una fila de 310 px: se parte en dos en vez de
   salirse de la caja. Los tramos necesitan min-width:0 o no encogen nada. */
.tit-id{display:flex;align-items:stretch;flex-wrap:wrap;justify-content:center;
  background:var(--void2);
  border:3px solid var(--y1);box-shadow:0 0 0 2px var(--bd),0 4px 0 var(--bd),
    0 0 20px rgba(255,207,63,.12);max-width:100%}
.tit-id>span{display:flex;align-items:center;gap:8px;padding:11px 14px;min-width:0;
  font-size:9px;letter-spacing:1px;color:var(--y2);white-space:nowrap}
.tit-id .sep{border-left:3px solid var(--y1)}

/* JUGAR con marcas de esquina, como una mira */
.jugar-marco{position:relative;padding:10px;display:flex}
.jugar-marco i{position:absolute;width:13px;height:13px;border:3px solid var(--g4);
  opacity:.9;pointer-events:none}
.jugar-marco i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
.jugar-marco i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.jugar-marco i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
.jugar-marco i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
.btn-jugar{font-size:clamp(14px,4.4vw,19px);padding:17px 40px;min-height:60px;position:relative}
/* El brillo va en una capa propia que solo cambia de OPACIDAD, cosa que hace
   la GPU sin repintar. Antes se animaba el box-shadow del botón (repintado en
   cada fotograma mientras la portada estuviera abierta) y, encima, con un
   @keyframes llamado `latido` que el aviso de la memoria volvía a definir
   más abajo: ganaba el segundo y JUGAR no brillaba, se desvanecía a medias. */
.btn-jugar::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:0 0 22px rgba(138,255,79,.35);opacity:0;animation:brillo 2.6s ease-in-out infinite}
@keyframes brillo{50%{opacity:1}}

/* banner angular del reto diario */
.tit-reto{position:relative;width:min(420px,100%);display:flex;align-items:center;gap:12px;
  justify-content:center;padding:15px 30px;min-height:56px;cursor:pointer;
  font-family:inherit;font-size:clamp(10px,3.2vw,13px);letter-spacing:1px;color:#fff;
  border:0;background:var(--v2);text-shadow:1px 1px 0 var(--v0);
  clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,18px 100%,0 50%)}
.tit-reto::after{content:'';position:absolute;inset:3px;
  border:2px solid rgba(217,194,255,.35);pointer-events:none;
  clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%)}
.tit-reto:active{transform:translateY(3px)}
.tit-reto .r-racha{display:flex;align-items:center;gap:5px;color:var(--y3);font-size:13px}
.tit-reto .r-llama{animation:llamear 1.4s ease-in-out infinite}
@keyframes llamear{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.18) rotate(3deg)}}

/* panel de dificultad con título embebido en el borde */
.dif-panel{position:relative;width:min(460px,100%);padding:20px 12px 14px;
  border:3px solid var(--bl);background:rgba(17,21,42,.55)}
.dif-panel .dif-cap{position:absolute;top:-9px;left:50%;transform:translateX(-50%);
  background:var(--pan);padding:0 12px;font-size:8px;letter-spacing:2px;color:var(--g3);
  white-space:nowrap}
.dif-puntos{display:flex;gap:5px;justify-content:center;margin-top:8px}
.dif-puntos i{width:6px;height:6px;background:var(--tx1);border-radius:50%}
.dif-op.sel .dif-puntos i.on{background:currentColor;box-shadow:0 0 7px currentColor}
.dif-op .dif-puntos i.on{background:var(--tx2)}

/* filas de menú: icono encima, etiqueta debajo.
   El icono NO va al lado del texto, y no es cosa de pantallas pequeñas:
   .tit-rejilla está topada en 460 px, así que con tres columnas la celda
   mide ~147 px por muy ancho que sea el monitor. Una fila horizontal se
   come ahí unos 50 px de cromo (icono, dos huecos y la flecha) y a la
   etiqueta le quedaban 75 px, donde TEXTO LEGIBLE salía TEXIO/LEGIBL/E y
   se desbordaba por debajo del botón. Apilado, la etiqueta se queda con
   toda la celda. */
.menu-fila{display:flex;flex-direction:column;align-items:center;gap:9px;width:100%;
  text-align:center;padding:11px 4px;min-height:54px;letter-spacing:1px}
/* El hueco es 9 y no 6 porque la tilde de RÉCORDS sube por encima de la
   altura de las mayúsculas y con 6 px rozaba el icono de arriba. */
/* line-height 1 le da al emoji una caja de 19 px justos, pero el glifo se
   dibuja más alto que eso y rebosaba por abajo hasta montarse encima de
   la etiqueta. Las cajas no se tocaban —por eso no lo veía midiendo
   rectángulos—, pero en pantalla el carrito caía sobre TIENDA. */
.menu-fila .m-ico{font-size:19px;line-height:1.25;flex:0 0 auto}
/* break-word y NO anywhere: `anywhere` deja que el mínimo del texto sea un
   solo carácter, así que la caja se encogía a 32 px y la etiqueta salía
   troceada en sílabas (TI/EN/DA). Con break-word solo se rompe una palabra
   que de verdad no quepa sola.
   letter-spacing a 0 solo aquí: el px por letra que hereda de .menu-fila le
   sumaba 13 px a TEXTO LEGIBLE, justo los que le faltaban para caber. */
/* Marca personal bajo la etiqueta, en el modo libre. Va en su propia línea
   y más pequeña: la etiqueta manda y el número acompaña. */
.menu-fila .m-marca{font-size:8px;color:var(--y2);letter-spacing:0;line-height:1.4}
.menu-fila .m-txt{flex:0 0 auto;max-width:100%;text-align:center;letter-spacing:0;
  line-height:1.45;font-size:clamp(8px,2.6vw,10px);overflow-wrap:break-word}
.tit-rejilla{display:grid;gap:9px;width:min(460px,100%)}
.tit-rejilla.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tit-rejilla.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
/* Por debajo de 560 px tres columnas dejan celdas de ~100 px, demasiado
   estrechas incluso apiladas: ahí se baja a dos. */
@media(max-width:560px){
  .tit-rejilla.c3{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* tarjeta de avatar, con el progreso de campaña dentro */
.tit-avatar{width:min(460px,100%);display:flex;flex-direction:column;gap:12px;
  padding:13px;border:3px solid var(--bl);background:var(--void2);
  box-shadow:0 0 0 2px var(--bd),0 4px 0 rgba(0,0,0,.4);cursor:pointer;
  font-family:inherit;text-align:left;color:inherit}
.tit-avatar:active{transform:translateY(3px);box-shadow:0 0 0 2px var(--bd)}
.tit-av-fila{display:flex;align-items:center;gap:13px}
.tit-av-fila canvas{width:56px;height:56px;image-rendering:pixelated;flex:0 0 auto;
  border:2px solid var(--g1);background:#0b0e22}
.tit-av-txt{flex:1;display:flex;flex-direction:column;gap:6px}
.tit-av-txt b{font-size:10px;color:var(--y2);letter-spacing:1px}
.tit-av-txt span{font-family:'VT323',monospace;font-size:16px;color:var(--tx2)}
.tit-prog-fila{display:flex;align-items:center;gap:10px}
.tit-prog-fila .p-lbl{font-size:7px;color:var(--g3);letter-spacing:1px;flex:0 0 auto}
.tit-prog-fila .barra{flex:1}
.tit-prog-fila .p-pc{font-size:10px;color:var(--y2);flex:0 0 auto}

/* panel "en qué flojeas": una fila por tema, con su barra */
.flojo-lista{display:flex;flex-direction:column;gap:9px;width:min(440px,100%)}
.flojo-fila{display:flex;align-items:center;gap:10px}
.flojo-fila .f-nom{font-size:7px;letter-spacing:1px;color:var(--tx3);
  flex:0 0 84px;text-align:left}
.flojo-fila .barra{flex:1}
.flojo-fila .f-num{font-family:'VT323',monospace;font-size:16px;color:var(--y2);
  flex:0 0 42px;text-align:right}
html.hd .flojo-fila .f-nom{font-size:11px}

/* pie con líneas a los lados */
.tit-pie{display:flex;align-items:center;gap:12px;width:min(420px,100%);opacity:.75}
.tit-pie i{flex:1;height:2px;background:var(--bl)}

/* Portada: rango+XP y progreso de campaña agrupados en un bloque propio */
.tit-bloque{display:flex;flex-direction:column;gap:9px;align-items:center;width:min(340px,100%)}
.tit-barra{width:min(320px,100%)}
.skin-op,.camisa-op{width:46px;height:46px;cursor:pointer;border:3px solid var(--bl);
  image-rendering:pixelated;background:var(--void2)}
.skin-op.sel,.camisa-op.sel{border-color:var(--y2)}
.l1{display:flex;flex-direction:column;gap:13px;padding:6px}
.tope{display:flex;justify-content:space-between;font-size:10px;color:var(--b4)}
.term{background:#070a12;border:2px solid var(--bl);box-shadow:0 0 0 2px var(--bd);}
.term-bar{display:flex;gap:6px;align-items:center;
  background:var(--pan2);padding:8px 10px;border-bottom:2px solid var(--bd)}
.term-bar i{width:9px;height:9px;border-radius:50%;display:block}
.term-cuerpo{padding:16px 12px;display:flex;flex-direction:column;gap:14px}
.term-line{font-family:'VT323',monospace;font-size:18px;color:var(--g3);text-align:left}
.palabra{font-size:clamp(18px,6.5vw,28px);letter-spacing:5px;color:var(--tx4);min-height:34px}
/* Al teclear, el color era la ÚNICA señal de que una letra iba mal: en
   escala de grises o con daltonismo rojo-verde, verde y rojo son el mismo
   tono. El fallo lleva además un subrayado, que se ve sin color. */
.palabra .ok{color:var(--g3)}
.palabra .mal{color:var(--r3);text-decoration:underline;text-decoration-thickness:3px;
  text-underline-offset:3px}
.palabra.shake{animation:shake .22s}
.barra{height:12px;background:var(--void2);border:2px solid var(--bd)}
.barra-fill{height:100%;width:100%;transition:width .1s linear;background:var(--g2);
  box-shadow:inset 0 3px 0 var(--g4)}
.barra-fill.peligro{background:var(--r3);box-shadow:inset 0 3px 0 var(--r4)}
.entrada{font-family:inherit;font-size:16px;text-align:center;letter-spacing:3px;
  background:#070a12;color:var(--g3);border:2px solid var(--g2);
  box-shadow:0 0 0 2px var(--bd);
  padding:14px 8px;outline:none;width:100%;text-transform:lowercase;}
/* el placeholder estaba en 1.64:1, prácticamente invisible */
.entrada::placeholder{color:var(--tx1);font-size:10px;letter-spacing:1px}
.entrada:focus{border-color:var(--g4)}
.l3,.l4{display:flex;flex-direction:column;gap:12px;padding:6px;align-items:center}
.l3 .tope,.l4 .tope{width:100%}
.grilla{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(350px,100%)}
.celda{aspect-ratio:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--bl);background:var(--void2);padding:0;
  box-shadow:0 4px 0 var(--bd);}
.celda .px{font-size:34px;line-height:1;transform:scale(.15);opacity:0;
  transition:transform .1s,opacity .1s}
.celda.on{border-color:var(--g2)}
.celda.on .px{transform:scale(1);opacity:1}
.celda.plaf{border-color:var(--y2)}
/* ── MINIJUEGO TERMINAL ── */
/* La tarea es prosa, no código: va en VT323 como el resto de los diálogos,
   que a 10px de fuente de píxeles una frase entera no se lee. */
.tm-tarea{font-family:'VT323',monospace;font-size:19px;line-height:1.25;
  color:var(--y2);margin:.35em 0;letter-spacing:0}
/* Reserva su alto aunque esté vacía: si no, al aparecer la pista o la
   corrección todo lo de abajo daba un salto. */
.tm-pista{min-height:1.5em;color:var(--tx2)}
html.legible .tm-tarea{font-size:21px}

.memo{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;width:min(360px,100%)}
/* Aviso de la ojeada previa: tiene que cantar más que un .mini normal,
   porque son los segundos en los que hay que mirar el tablero. */
.memo-aviso{color:var(--y2);animation:latido 1s steps(2,end) infinite}
@keyframes latido{50%{opacity:.45}}
.carta{aspect-ratio:1;font-family:inherit;font-size:11px;cursor:pointer;
  color:var(--tx1);border:2px solid var(--bl);
  background:var(--void2);box-shadow:0 3px 0 var(--bd);
  display:flex;align-items:center;justify-content:center;transition:transform .1s;}
.carta.vista{background:var(--b1);color:var(--b4);
  border-color:var(--b3);transform:scale(1.04)}
.carta.fija{background:#143518;color:var(--g4);
  border-color:var(--g2);cursor:default;transform:none}
.simon{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(350px,100%)}
.cmd{font-family:inherit;font-size:10px;color:#fff;cursor:pointer;padding:26px 8px;
  border:2px solid var(--bd);letter-spacing:1px;text-shadow:1px 1px 0 rgba(0,0,0,.7);
  opacity:.5;transition:opacity .1s,transform .1s;text-align:center}
.cmd:active,.cmd.activo{opacity:1;transform:scale(1.04)}
.simon.muestra{pointer-events:none}
.c-pull  {background:var(--b2);box-shadow:inset 0 3px 0 var(--b3),inset 0 -3px 0 var(--b1)}
.c-commit{background:#8a6a10;box-shadow:inset 0 3px 0 #c4a030,inset 0 -3px 0 #544010}
.c-push  {background:var(--g1);box-shadow:inset 0 3px 0 var(--g3),inset 0 -3px 0 var(--g0)}
.c-deploy{background:var(--v1);box-shadow:inset 0 3px 0 var(--v2),inset 0 -3px 0 var(--v0)}
.c-rebase{background:#a1341f;box-shadow:inset 0 3px 0 #d4603f,inset 0 -3px 0 #611c0e}
.c-stash {background:#0f7a6a;box-shadow:inset 0 3px 0 #3fa898,inset 0 -3px 0 #084840}
.c-merge {background:#6b3fa0;box-shadow:inset 0 3px 0 #9a6fd0,inset 0 -3px 0 #43276a}
.c-fetch {background:#1c6f9c;box-shadow:inset 0 3px 0 #48a0cf,inset 0 -3px 0 #0e4262}
.c-tag   {background:#6f7a12;box-shadow:inset 0 3px 0 #a3b030,inset 0 -3px 0 #40470a}
.c-log   {background:#45507a;box-shadow:inset 0 3px 0 #6f7cb0,inset 0 -3px 0 #28304d}
.c-diff  {background:#9c1f6f;box-shadow:inset 0 3px 0 #cf4fa0,inset 0 -3px 0 #5e1042}
.c-reset {background:#a35a12;box-shadow:inset 0 3px 0 #d18a3a,inset 0 -3px 0 #613208}
.quiz{display:flex;flex-direction:column;gap:12px;padding:6px;align-items:center}
.jurado{display:flex;gap:12px}
.jurado canvas{width:52px;height:52px;image-rendering:pixelated;
  border:2px solid var(--bd);background:#0b0e22}
.pregunta{font-family:'VT323',monospace;font-size:23px;line-height:1.3;text-align:center;
  min-height:56px;display:flex;align-items:center;justify-content:center;padding:4px;color:var(--tx4)}
.opciones{display:flex;flex-direction:column;gap:9px;width:min(420px,100%)}
.op{font-family:'VT323',monospace;font-size:21px;color:var(--tx4);cursor:pointer;
  text-align:left;padding:13px 15px;border:2px solid var(--bl);
  background:var(--pan2);box-shadow:0 3px 0 var(--bd);}
.op:active{transform:translateY(3px);box-shadow:none}
.op.bien{background:#143518;border-color:var(--g3)}
.op.mal {background:#3d1219;border-color:var(--r3)}
.cv-wrap{position:relative;display:flex;flex-direction:column;gap:10px;padding:6px;align-items:center}
canvas.juego{width:100%;aspect-ratio:16/9;image-rendering:pixelated;display:block;
  background:#000;border:2px solid var(--bd);
  box-shadow:0 0 0 2px var(--bl);touch-action:none}
.cv-msg{font-family:'VT323',monospace;font-size:16px;color:var(--tx2);text-align:center;line-height:1.3}
.fila-cv{display:flex;gap:14px;align-items:center;justify-content:center;width:100%}
.dpad{display:grid;gap:6px;
  grid-template-areas:'. up .' 'left mid right' '. down .';}
.dp{width:54px;height:46px;font-family:inherit;font-size:15px;color:var(--b4);cursor:pointer;
  border:2px solid var(--bl);background:var(--pan2);
  box-shadow:0 3px 0 var(--bd);}
.dp:active{transform:translateY(3px);box-shadow:none}
.dp-arriba{grid-area:up}.dp-abajo{grid-area:down}.dp-izq{grid-area:left}.dp-der{grid-area:right}
@keyframes aparecer{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.25}}
/* Quien pide menos movimiento no debe ver el fondo derivando ni el latido */
@media(prefers-reduced-motion:reduce){
  .mte,.btn-jugar,.btn-jugar::after,.tit-reto .r-llama,.blink,.punto-nuevo,.memo-aviso{animation:none!important}
}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes logro-entra{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes aparece-int{from{opacity:0;transform:translateX(-50%) scale(.9)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.rango-linea{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.rango-badge{font-size:8px;color:var(--g3);background:var(--void2);border:2px solid var(--g1);padding:6px 10px;letter-spacing:1px}
.rango-badge.grande{font-size:11px;padding:9px 14px;color:var(--y2);border-color:var(--y1)}
.moneda{font-size:9px;color:var(--y2);background:var(--void2);border:2px solid var(--bl);padding:6px 10px}
.xp-bar{height:10px;width:min(300px,80%);background:var(--void2);border:2px solid var(--bd);margin:0 auto;overflow:hidden}
.xp-fill{height:100%;background:var(--v2);box-shadow:inset 0 3px 0 var(--v3);transition:width .5s ease-out}
.xp-txt{font-family:'VT323',monospace;font-size:15px;color:var(--tx2);letter-spacing:1px}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(420px,100%)}
.stats-grid>div{background:var(--void2);border:2px solid var(--bl);padding:10px 4px;display:flex;flex-direction:column;gap:4px;align-items:center}
.stats-grid b{font-size:15px;color:var(--y2)}
.stats-grid span{font-size:7px;color:var(--tx2);text-align:center;line-height:1.5}
.rango-lista{display:flex;flex-direction:column;gap:4px;width:min(420px,100%)}
.rango-fila{display:flex;justify-content:space-between;font-family:'VT323',monospace;font-size:16px;color:var(--tx1);background:var(--void2);border:2px solid transparent;padding:7px 11px}
.rango-fila.hecho{color:var(--g3)}
.rango-fila.act{color:var(--y2);border-color:var(--y1);background:var(--pan2)}
.acc-op{position:relative;width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:var(--void2);border:3px solid var(--bl);cursor:pointer;font-size:22px}
.acc-op.sel{border-color:var(--y2)}
.acc-op.bloq .acc-ico{filter:grayscale(.6) brightness(.65)}
.acc-precio{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);font-family:'Press Start 2P',monospace;font-size:7px;color:var(--y2);background:var(--bd);padding:2px 4px;white-space:nowrap}
.acc-op.shake{animation:shake .3s}
.entrada.shake{animation:shake .3s}
.entrada[aria-invalid="true"]{border-color:var(--r3)}
/* .mini va después de .rojo y le ganaba el color: un aviso tiene que verse */
.mini.rojo{color:var(--r3)}
.confeti{position:absolute;top:-24px;z-index:40;pointer-events:none;line-height:1;
  animation:confeti-cae 2.8s linear forwards}
@keyframes confeti-cae{to{transform:translateY(105vh) rotate(720deg);opacity:.1}}
.combo-txt{color:var(--y2)}
@media (prefers-reduced-motion:reduce){.blink,#screen>*,.confeti,.fade-in,.etapa-jefe,.sacudida{animation:none}}

/* ── MAPA DE CARRERA ── */
.mapa h2{margin:.15em 0}
/* 94vw medía el viewport y no la caja: dentro de #app, con sus bordes y
   relleno, la lista de etapas sobresalía 22 px en un móvil de 360. */
.etapas{display:flex;flex-direction:column;gap:0;width:min(440px,100%);margin:14px auto 6px}
.etapa-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:#141a38;border:3px solid #2a3260;border-radius:12px;padding:12px 14px;color:#cdd6f4;
  font-family:inherit;cursor:pointer;position:relative;transition:transform .08s,border-color .15s}
.etapa-card:not([disabled]):active{transform:scale(.98)}
.etapa-card:not([disabled]):hover{transform:translateY(-2px);border-color:#6fd62b}
.etapa-card.ok{border-color:#39a900;background:#102a16}
.etapa-card.open{border-color:#ffd23c;box-shadow:0 0 0 1px #ffd23c inset}
.etapa-card.lock{opacity:.45;filter:grayscale(.7);cursor:not-allowed}
.etapa-num{font-size:12px;color:#7a86c8;font-weight:bold;width:16px;text-align:center}
.etapa-ico{font-size:32px;width:42px;text-align:center;line-height:1}
.etapa-body{flex:1;min-width:0}
/* El nombre se adapta al ancho y puede romper si hace falta: a 320 px la caja
   del nombre son 106 px y "SUSTENTACIÓN" a 15 px pide 186, así que se salía
   de la tarjeta. Nunca se monta una palabra sobre otra. */
.etapa-nom{font-size:clamp(12px,3.4vw,15px);color:#fff;font-weight:bold;
  letter-spacing:.5px;overflow-wrap:break-word}
.etapa-sub{font-size:11px;color:#9aa6e0;margin-top:1px}
.etapa-rango{font-size:10px;color:#ffd23c;margin-top:3px;letter-spacing:.5px}
.etapa-badge{font-size:20px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:30px}
.etapa-badge .aqui{font-size:8px;color:#6fd62b;border:1px solid #6fd62b;border-radius:4px;padding:0 3px;letter-spacing:.5px}

/* ── tarjeta de nivel en pantallas estrechas ──
   El cromo (número, icono, insignia y tres huecos de 12 px) se llevaba 94 de
   los 252 px útiles y al nombre le quedaban 105: "SUSTENTACIÓN" pide 152 y se
   partía a mitad de palabra. Apretando el cromo el nombre pasa a tener ~173.
   Este bloque va DESPUÉS de las reglas base a propósito: con la misma
   especificidad gana la última, y puesto antes no hacía nada. */
@media(max-width:560px){
  .etapa-card{gap:6px;padding:11px 9px}
  .etapa-ico{font-size:24px;width:24px}
  .etapa-num{width:13px;font-size:11px}
  .etapa-badge{font-size:16px;min-width:24px}
}
.etapa-link{width:4px;height:14px;background:#2a3260;margin:0 auto}
.etapa-card.ok + .etapa-link{background:#39a900}
.etapa-link-jefe{background:linear-gradient(#39a900,#c22e44);height:18px}
.etapa-jefe{border-color:#c22e44;background:#1a0613;animation:pulsarJefe 2s ease-in-out infinite}
.etapa-jefe:hover{border-color:#ff5468;transform:translateY(-2px)}
.etapa-jefe .etapa-num{color:#ff5468}
.etapa-jefe .etapa-badge{color:#ff9900;font-size:18px}
@keyframes pulsarJefe{0%,100%{box-shadow:0 0 0 0 rgba(194,46,68,.4)}50%{box-shadow:0 0 0 6px rgba(194,46,68,0)}}

/* ── TRANSICIÓN DE PANTALLA ── */
.fade-in{animation:fadeIn .28s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── SACUDIDA AL RECIBIR DAÑO ── */
.sacudida{animation:sacudir .3s}
@keyframes sacudir{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(4px,-2px)}}

/* ── CÓDIGO DE GUARDADO ── */
.guardado-zona{display:flex;flex-direction:column;gap:8px;width:min(420px,100%);align-items:center}
.cod-guardado{width:100%;font-family:'VT323',monospace;font-size:14px;resize:none;
  background:var(--void2);color:var(--tx1);border:2px solid var(--bl);padding:8px;word-break:break-all}

/* ── SELECTOR DE DIFICULTAD ── */
.dif-sel{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:2px 0}
.dif-op{font-family:'Press Start 2P',monospace;font-size:8px;letter-spacing:.5px;color:var(--tx2);
  background:var(--void2);border:2px solid var(--bl);padding:8px 9px;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:4px;min-width:74px;line-height:1.4}
.dif-op .dif-ico{font-size:16px}
.dif-op.sel{color:var(--y2);border-color:var(--y1);background:var(--pan2);box-shadow:0 0 0 1px var(--y1) inset}
.dif-op:active{transform:scale(.96)}
.dif-badge{font-size:8px;color:var(--tx2);background:var(--void2);border:2px solid var(--bl);padding:6px 10px;letter-spacing:1px}

/* ── RACHA / COMBO FLOTANTE (runner) ── */
.combo-fly{position:absolute;left:50%;top:34%;transform:translateX(-50%);z-index:35;pointer-events:none;
  font-family:'Press Start 2P',monospace;font-size:13px;color:var(--y2);text-shadow:0 2px 0 #7a3b00;
  animation:comboPop .7s ease-out forwards}
@keyframes comboPop{0%{opacity:0;transform:translateX(-50%) scale(.5)}30%{opacity:1;transform:translateX(-50%) scale(1.15)}100%{opacity:0;transform:translateX(-50%) translateY(-26px) scale(1)}}

/* ── BOTÓN COMPARTIR ── */
.btn-share{background:var(--bl);color:#fff}

/* ── SECCIONES DEL MAPA ── */
.mapa-sec{font-size:10px;color:#9aa6e0;letter-spacing:2px;text-align:center;margin:10px 0 4px;
  display:flex;align-items:center;gap:10px;width:100%}
.mapa-sec::before,.mapa-sec::after{content:'';flex:1;height:2px;background:#2a3260}

/* ── TIENDA: descripciones de mejoras ── */
.mej-info{flex:1;display:flex;flex-direction:column;gap:3px;text-align:left;padding:0 8px}
.mej-desc{font-family:'VT323',monospace;font-size:14px;color:var(--tx2);line-height:1.2}

/* ── MINIJUEGO SQL ── */
.sql-armada{font-family:'VT323',monospace;font-size:18px;color:var(--tx1);word-break:break-word;min-height:24px}
.sql-ok{color:#6fd62b}
.sql-piezas{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.sql-pieza{font-family:'VT323',monospace;font-size:17px;color:var(--tx1);cursor:pointer;
  background:var(--void2);border:2px solid var(--bl);padding:9px 12px}
.sql-pieza:not(.usada):hover{border-color:#6fd62b}
.sql-pieza.usada{opacity:.28;pointer-events:none;border-color:#39a900}
.sql-pieza.shake{animation:shake .25s}

/* ── MINIJUEGO REGEX ── */
.rx-patron{display:flex;flex-direction:column;align-items:center;gap:6px;
  background:var(--void2);border:2px solid var(--bl);padding:12px 18px;width:min(380px,100%)}
.rx-re{font-family:'VT323',monospace;font-size:24px;color:#ffcf3f;letter-spacing:1px}
.rx-desc{font-family:'VT323',monospace;font-size:16px;color:var(--tx2)}
.rx-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(380px,100%)}
.rx-op{font-family:'VT323',monospace;font-size:17px}

/* ── CUTSCENES ── */
.cut{cursor:pointer}
.cut-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:8px}
.cut-prog{font-size:11px;color:#7a86c8;letter-spacing:1px}
.cut-skip{margin-top:12px;background:none;border:none;color:#5a6498;font-family:inherit;font-size:11px;cursor:pointer;text-decoration:underline;opacity:.85}
.cut-skip:hover{color:#9aa6e0}

/* ── TIENDA DEL MENÚ ── */
.accs-tienda{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;max-width:min(420px,92vw);margin:12px auto}
.acc-op{position:relative}
.acc-eq{position:absolute;top:-7px;right:-7px;background:#39a900;color:#fff;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:11px;border:2px solid #0c1024}

/* ── MEJORAS EN TIENDA ── */
.mej-titulo{font-size:12px;color:#9aa6e0;letter-spacing:1px;margin:14px 0 4px;text-align:center}
.mejoras-tienda{display:flex;flex-direction:column;gap:8px;max-width:min(420px,92vw);margin:0 auto}
.item-tienda.activa{border-color:#39a900;background:#102a16;opacity:1}
.item-tienda.activa .precio{color:#6fd62b}

/* ── CODE REVIEW / MERGE ── */
.code-line{font-family:'VT323',monospace;font-size:clamp(20px,6vw,27px);color:var(--tx4);
  min-height:38px;text-align:left;line-height:1.3;word-break:break-all}
.rev-botones{display:flex;gap:10px;width:100%}
.rev-botones .btn,.rev-botones .btn-r{flex:1}
/* RECHAZAR + APROBAR con el relleno normal pedían 296 px en una fila de 270
   (móvil de 320): APROBAR salía cortado por el borde. */
@media (max-width:360px){
  .rev-botones{gap:8px}
  .rev-botones .btn,.rev-botones .btn-r{min-width:0;padding-left:6px;padding-right:6px;letter-spacing:0}
}
.btn-r{font-family:inherit;font-size:12px;color:#fff;cursor:pointer;letter-spacing:1px;
  padding:15px 22px;min-height:48px;border:2px solid var(--bd);background:var(--r2);
  box-shadow:inset 0 3px 0 var(--r3),inset 0 -3px 0 var(--r1),0 4px 0 var(--bd);
  text-shadow:1px 1px 0 var(--r1)}
.btn-r:active{transform:translateY(4px);box-shadow:inset 0 3px 0 var(--r3),inset 0 -3px 0 var(--r1)}
.conflicto-marca{font-family:'VT323',monospace;font-size:17px;color:var(--o3);text-align:left}

html.hd .etapa-card.open{box-shadow:0 0 22px rgba(255,210,60,.22)}
html.hd .ico{filter:drop-shadow(0 0 18px rgba(255,255,255,.2))}

/* ── CAPA 64-BIT: iluminación de pantalla ── */
#fx64{position:fixed;inset:0;pointer-events:none;z-index:15;
  background:
    radial-gradient(125% 105% at 50% 36%, transparent 56%, rgba(3,4,16,.26) 100%),
    repeating-linear-gradient(0deg, rgba(0,0,0,.045) 0 1px, transparent 1px 3px),
    linear-gradient(180deg, rgba(180,200,255,.04), transparent 16%);
}
@media (max-width:520px){ #fx64{background:
    radial-gradient(130% 110% at 50% 36%, transparent 58%, rgba(3,4,16,.22) 100%),
    repeating-linear-gradient(0deg, rgba(0,0,0,.04) 0 1px, transparent 1px 3px);} }

/* ══════════════════════════════════════════════
   MODO TEXTO LEGIBLE
   La tipografía de píxeles es preciosa y mala de
   leer en cuerpos pequeños. La prosa larga
   (diálogos, preguntas, opciones) ya iba en
   VT323; esto cambia lo que quedaba a 8-9 px:
   nombres de logro y sus pistas, nombres de
   nivel, artículos de la tienda y las etiquetas
   de estadísticas. Va al final del archivo para
   ganar por orden a las reglas base.
   ══════════════════════════════════════════════ */
html.legible .logro p,
html.legible .logro .pista,
html.legible .etapa-nom,
html.legible .etapa-sub,
html.legible .etapa-rango,
html.legible .nom-t,
html.legible .sub,
html.legible .hablante,
html.legible .stats-grid span,
html.legible .dia,
html.legible .dif-op,
html.legible .m-txt{font-family:'VT323',monospace;letter-spacing:0}
html.legible .logro p{font-size:14px;line-height:1.25}
html.legible .logro .pista{font-size:13px;line-height:1.25}
html.legible .etapa-nom{font-size:clamp(17px,4.6vw,21px)}
html.legible .etapa-sub{font-size:16px}
html.legible .etapa-rango{font-size:14px}
html.legible .nom-t{font-size:14px;line-height:1.2}
html.legible .sub{font-size:15px;line-height:1.35}
html.legible .hablante{font-size:15px}
html.legible .stats-grid span{font-size:14px;line-height:1.2}
html.legible .dia{font-size:14px}
html.legible .dif-op{font-size:15px}
html.legible .m-txt{font-size:17px}

/* ══════════════════════════════════════════════
   PANTALLA APAISADA
   Computador, tablet tumbada o móvil de lado.
   encajar() pone html.apaisado cuando la pantalla
   es bastante más ancha que alta; el marco pasa a
   ser ancho (hasta 1120 px lógicos, y con zoom
   crece a lo que dé el monitor) y aquí se reparte
   cada pantalla en ese ancho en vez de apilarla.
   En vertical NADA de esto aplica: el móvil queda
   exactamente como estaba.
   ══════════════════════════════════════════════ */
/* Dos columnas que en vertical no existen: sin caja propia, sus hijos son
   hijos directos de .centro y el orden es el de siempre. */
.col2,.col2>.col{display:contents}
html.apaisado .col2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px 28px;width:100%;align-items:start}
html.apaisado .col2>.col{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
/* Portada: rejilla propia. La columna de identidad es la corta, así que el
   pie (PULSA START y BORRAR PROGRESO) va debajo de ELLA y no debajo de las
   dos: apilado al final, la portada pedía 620 px de alto en un marco de 620
   y con el texto legible se pasaba hasta 32. Las columnas se centran entre
   sí, que la de identidad arriba del todo se veía colgando. */
html.apaisado .centro.portada{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-rows:1fr auto auto;column-gap:28px;row-gap:11px;align-items:center}
html.apaisado .centro.portada>.col2{display:contents}
html.apaisado .centro.portada>.col2>.col{gap:11px}
html.apaisado .centro.portada>.col2>.col:first-child{grid-column:1;grid-row:1}
html.apaisado .centro.portada>.col2>.col:last-child{grid-column:2;grid-row:1/-1}
html.apaisado .centro.portada>.tit-pie{grid-column:1;grid-row:2;justify-self:center}
html.apaisado .centro.portada>.cut-skip{grid-column:1;grid-row:3;justify-self:center}

/* El alto útil manda en apaisado: con #screen como contenedor, los tableros
   se dimensionan por el alto que queda (cqh) y no solo por el ancho. */
html.apaisado #screen{container-type:size}

/* ── mapa: de lista a rejilla de casillas, una fila por semana ──
   El título y la píldora van en la misma fila: apilados empujaban VOLVER
   44 px por debajo del borde en un portátil de 768.
   Columnas 1fr a los lados y no `auto auto` a secas: la rejilla de etapas
   ocupa todo el ancho y, cruzando dos columnas auto, las ensanchaba a las
   dos, así que la píldora salía el doble de ancha con un hueco dentro. Un
   elemento que cruza una columna fr no cuenta para medir las auto. */
html.apaisado .centro.mapa{display:grid;grid-template-columns:1fr auto auto 1fr;
  align-items:center;column-gap:24px;row-gap:10px}
html.apaisado .centro.mapa>h2{grid-column:2}
html.apaisado .centro.mapa>.tit-id{grid-column:3}
html.apaisado .centro.mapa>.etapas{grid-column:1/-1}
html.apaisado .centro.mapa>.btn{grid-column:1/-1;justify-self:center}
html.apaisado .etapas{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  gap:10px;width:100%;margin:8px 0 4px}
html.apaisado .etapa-link{display:none}
html.apaisado .mapa-sec{grid-column:1/-1;margin:4px 0 0}
html.apaisado .etapa-card{flex-direction:column;justify-content:flex-start;text-align:center;
  gap:6px;padding:12px 8px 10px;height:100%}
html.apaisado .etapa-card .etapa-num{position:absolute;top:7px;left:9px;width:auto}
html.apaisado .etapa-card .etapa-ico{width:auto;font-size:28px}
html.apaisado .etapa-card .etapa-body{flex:0 1 auto;width:100%}
html.apaisado .etapa-card .etapa-nom{display:block;font-size:11px;line-height:1.45}
html.apaisado .etapa-card .etapa-sub{font-size:9px;line-height:1.5;margin-top:4px}
/* las estrellas ya van en la insignia: en la casilla la línea MEJOR sobra */
html.apaisado .etapa-card .etapa-rango{display:none!important}
html.apaisado .etapa-card .etapa-badge{flex-direction:row;font-size:14px;margin-top:auto;min-width:0}
/* el jefe secreto cierra el mapa como franja, no como casilla suelta */
html.apaisado .etapa-jefe{grid-column:1/-1;flex-direction:row;text-align:left;padding:12px 16px}
html.apaisado .etapa-jefe .etapa-num{position:static}
html.apaisado .etapa-jefe .etapa-body{flex:1}
html.apaisado .etapa-jefe .etapa-badge{margin-top:0}
html.apaisado.legible .etapa-card .etapa-nom{font-size:17px;line-height:1.1}
html.apaisado.legible .etapa-card .etapa-sub{font-size:15px;line-height:1.1}

/* ── logros y modo libre: cinco por fila ── */
html.apaisado .logros-grid{grid-template-columns:repeat(5,minmax(0,1fr));width:min(940px,100%)}
html.apaisado #lb-lista{grid-template-columns:repeat(5,minmax(0,1fr));width:min(940px,100%)}
html.apaisado .logro{padding:9px 5px}

/* ── certificado y ascenso: un diploma apaisado ──
   El retrato, las estrellas y el rango a la izquierda; el texto a la
   derecha. De pie, la misma hoja pedía el doble del alto del marco. */
html.apaisado .cert{display:grid;width:min(820px,100%);column-gap:28px;row-gap:10px;
  grid-template-columns:auto minmax(0,1fr);align-items:center;justify-items:center;
  grid-template-areas:"tit tit" "cara de" "cara nom" "est txt" "badge stats" ". firma"}
html.apaisado .cert>.dia{grid-area:tit}
html.apaisado .cert>.retrato-wrap{grid-area:cara;width:112px;height:112px;flex-basis:112px}
html.apaisado .cert canvas.retrato{width:112px;height:112px}
html.apaisado .cert>.cert-de{grid-area:de}
html.apaisado .cert>.rango{grid-area:nom}
html.apaisado .cert>.desc{grid-area:txt}
html.apaisado .cert>.stars-row{grid-area:est}
html.apaisado .cert>.stats-grid{grid-area:stats}
html.apaisado .cert>.rango-badge{grid-area:badge}
html.apaisado .cert>.cert-firma{grid-area:firma}
/* compartir y volver, uno al lado del otro (1fr a los lados: ver el mapa) */
html.apaisado .centro:has(>.cert){display:grid;grid-template-columns:1fr auto auto 1fr;
  align-items:center;gap:14px 16px}
html.apaisado .centro:has(>.cert)>.cert{grid-column:1/-1;justify-self:center}
html.apaisado .centro:has(>.cert)>.btn-share{grid-column:2}
html.apaisado .centro:has(>.cert)>.btn2{grid-column:3}

/* ── minijuegos: ancho de lectura, no de pantalla ── */
html.apaisado .l1,html.apaisado .l3,html.apaisado .l4,html.apaisado .quiz{max-width:760px}
/* tableros cuadrados: los topa el alto que queda debajo del marcador */
html.apaisado .grilla{width:min(350px,100%,calc(100cqh - 120px))}
/* Memoria: 12, 16 o 20 cartas. De pie van a 4 columnas (3 a 5 filas); en
   apaisado, en DOS filas, que es la forma que tiene la pantalla. Un 4×4
   cuadrado no cabía en el alto de un móvil de lado, y encogerlo tampoco:
   cada carta necesita ~50 px de ancho para su palabra. */
html.apaisado .memo{--cols:6;grid-template-columns:repeat(var(--cols),minmax(0,1fr));
  width:min(760px,100%,calc((100cqh - 120px)*var(--cols)/2))}
html.apaisado .memo:has(>:nth-child(16)){--cols:8}
html.apaisado .memo:has(>:nth-child(20)){--cols:10}
html.apaisado .simon{grid-template-columns:repeat(4,minmax(0,1fr));width:min(640px,100%)}
html.apaisado .quiz .opciones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}
html.apaisado .rx-grid{grid-template-columns:repeat(3,minmax(0,1fr));width:min(720px,100%)}
/* terminal: la entrada y ENVIAR en una fila, como un chat, en vez de apilados */
html.apaisado .l1:has(>#tm-ok){display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:stretch}
html.apaisado .l1:has(>#tm-ok)>:not(.entrada):not(#tm-ok){grid-column:1/-1}

/* ── canvas (runner y jefe): lienzo a la izquierda, mando a la derecha ──
   Apilados, en un móvil de lado los botones quedaban DEBAJO del borde y
   había que hacer scroll en plena partida. El lienzo toma el alto que
   quede y el ancho que deje el mando, sin salirse de 16:9. */
html.apaisado .cv-wrap{display:grid;grid-template-columns:auto auto;
  grid-template-areas:"tope tope" "cv ctrl" "msg ctrl";
  justify-content:center;align-items:center;column-gap:18px;row-gap:8px}
html.apaisado .cv-wrap>.tope{grid-area:tope}
html.apaisado .cv-wrap>canvas.juego{grid-area:cv;
  width:min(calc(100cqw - 200px),calc((100cqh - 86px)*16/9))}
html.apaisado .cv-wrap>.cv-msg{grid-area:msg}
html.apaisado .cv-wrap>.fila-cv{grid-area:ctrl;flex-direction:column;width:auto}

/* ── móvil de lado: poco alto, se aprieta el cromo ── */
@media (max-height:480px){
  html.apaisado #app{padding:7px 10px;gap:6px}
  html.apaisado #hud{padding-bottom:6px}
  html.apaisado .centro{gap:8px;padding:4px 6px}
  /* el jurado y la pregunta ceden alto para que quepan las cuatro opciones */
  html.apaisado .jurado canvas{width:38px;height:38px}
  html.apaisado .pregunta{min-height:0;font-size:21px}
  html.apaisado .quiz{gap:8px}
  html.apaisado .quiz .op{padding:8px 12px;font-size:19px}
  /* Terminal, review, merge, regex: la barra de ventana es adorno y el
     contenido no cabía con ella. Fuera, y el cuerpo más apretado. */
  html.apaisado .term-bar{display:none}
  html.apaisado .term-cuerpo{padding:8px 12px;gap:6px}
  html.apaisado .l1,html.apaisado .l3,html.apaisado .l4{gap:8px;padding:2px 6px}
  html.apaisado .term .op{padding:8px 12px}
  html.apaisado .conflicto-marca{line-height:1.1}
}

/* El giroscopio es cosa de móvil: en un equipo sin pantalla táctil el botón
   GIRO no hace nada y solo confunde. Da igual la orientación. */
@media not (any-pointer:coarse){#j-giro{display:none}}

/* ══════════════════════════════════════════════
   SALAS DE CLASE (salaui.js)
   El proyector se lee desde el fondo del salón:
   código gigante, personajes grandes, poco texto.
   ══════════════════════════════════════════════ */
/* portada: Libre · Sin fin · Sala. Con dos columnas, la sala baja a lo ancho */
@media(max-width:560px){.tit-modos>.menu-fila:nth-child(3){grid-column:1/-1}}

/* entrada: dos cajas, instructor y aprendiz */
.sala-entrada{width:min(460px,100%)}
.sala-caja{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;
  padding:16px 12px;border:3px solid var(--bl);background:rgba(17,21,42,.55)}
.sala-caja+.sala-caja{margin-top:14px}
html.apaisado .sala-entrada{width:min(820px,100%);gap:16px}
html.apaisado .sala-caja+.sala-caja{margin-top:0}
html.apaisado .sala-caja{height:100%;justify-content:center}
.sala-in{width:min(230px,100%);font-size:22px;letter-spacing:8px;text-transform:uppercase}
.sala-previa b{color:var(--y2)}

/* crear: minijuegos marcables, con su número de orden */
.sala-j{position:relative}
.sala-j.sel{background:var(--g1);box-shadow:inset 0 3px 0 var(--g3),inset 0 -3px 0 var(--g0),0 4px 0 var(--bd)}
.sala-j:disabled{opacity:.4;cursor:not-allowed}
.sj-num{position:absolute;top:5px;left:6px;font-size:9px;color:var(--y2);min-width:9px}
.sc-n{color:var(--y2)}
html.apaisado .sala-juegos{grid-template-columns:repeat(6,minmax(0,1fr));width:min(940px,100%)}

/* ── proyector ── */
.sala-proy{display:flex;flex-direction:column;gap:16px;padding:6px;min-height:100%}
.sp-lado{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.sp-cap{font-size:8px;letter-spacing:2px;color:var(--g3)}
.sp-url{font-family:'VT323',monospace;font-size:24px;color:var(--tx4);overflow-wrap:anywhere}
.sp-codigo-marco{padding:14px 18px}
.sp-codigo{display:flex;gap:.18em;font-size:clamp(24px,9vw,52px);line-height:1;color:var(--y2);
  text-shadow:4px 4px 0 var(--g0),0 0 22px rgba(255,207,63,.35)}
.sp-codigo b{font-weight:400;padding:.12em .1em;background:var(--void2);border:3px solid var(--bl)}
.sp-reglas{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:9px;color:var(--tx3)}
.sp-reglas>span{padding:8px 10px;border:2px solid var(--bl);background:var(--void2)}
.sp-juegos{font-size:16px;letter-spacing:4px}
.sp-estado{font-family:'VT323',monospace;font-size:21px;color:var(--b4)}
.sp-mandos{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(320px,100%)}
.sp-mandos>.btn{width:100%}
.sp-main{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.sp-vacio{text-align:center;max-width:380px}
#sp-terminar.armado,#sp-terminar.armado:active{background:var(--r2)}
html.apaisado .sala-proy{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);
  gap:22px;align-items:start;height:100cqh;padding:4px 8px}
html.apaisado .sp-lado{position:sticky;top:0;justify-content:center;min-height:100%}
/* 5 letras con su caja caben en la columna: lo topa el ancho (cqw) o el alto */
html.apaisado .sp-codigo{font-size:max(24px,min(12cqh,4.6cqw,80px))}
html.apaisado .sp-main{max-height:100cqh;overflow:auto;padding:4px 4px 8px}

/* ── jugadores: rejilla (espera) y tabla (en juego) ── */
.sala-lista{width:min(520px,100%)}
html.apaisado .sp-main .sala-lista{width:100%}
.sl-rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.sj-carta{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:10px 4px 8px;background:var(--pan2);border:2px solid var(--bl);
  box-shadow:0 3px 0 var(--bd)}
.sj-carta canvas.retrato,.pd-col canvas.retrato{width:56px;height:56px}
.sj-nom{font-family:'VT323',monospace;font-size:19px;line-height:1;color:var(--tx4);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sj-carta.yo,.sj-fila.yo{border-color:var(--y2);box-shadow:0 0 0 2px var(--y1),0 3px 0 var(--bd)}
.sj-carta.yo .sj-nom,.sj-fila.yo .sj-nom{color:var(--y2)}
/* aparece "en pasos", como un sprite, no con un fundido suave */
.sj-carta.entra,.sj-fila.entra{animation:sj-entra .36s steps(4) both}
/* en el proyector los personajes se ven desde el fondo del salón */
html.apaisado .sp-main .sl-rejilla{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:14px}
html.apaisado .sp-main .sj-carta canvas.retrato{width:84px;height:84px}
html.apaisado .sp-main .sj-carta .sj-nom{font-size:23px}
@keyframes sj-entra{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.sj-fuera{position:absolute;top:3px;right:3px;width:24px;height:24px;font-size:10px;cursor:pointer;
  background:var(--void2);border:2px solid var(--bl);color:var(--tx2);line-height:1}
.sj-fuera:hover,.sj-fuera.armado{background:var(--r2);color:#fff;border-color:var(--r3)}

.sl-tabla{display:flex;flex-direction:column;gap:7px}
.sj-fila{position:relative;display:grid;grid-template-columns:34px 44px minmax(0,1fr) auto;
  align-items:center;gap:10px;padding:7px 36px 7px 10px;background:var(--pan2);
  border:2px solid var(--bl);box-shadow:0 3px 0 var(--bd);
  transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.sj-fila .sj-fuera{top:50%;transform:translateY(-50%)}
.sj-fila canvas.retrato{width:44px;height:44px}
.sj-pos{font-size:12px;color:var(--tx2);text-align:center}
.sj-info{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0;text-align:left}
.sj-info .sj-barra{align-self:stretch}
.sj-prog{display:flex;gap:4px}
.sj-prog i{width:9px;height:9px;background:var(--void2);border:2px solid var(--bl)}
.sj-prog i.on{background:var(--g3);border-color:var(--g2)}
.sj-barra{height:6px;background:var(--void2);border:1px solid var(--bl)}
.sj-barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g2),var(--g4));
  transition:width .6s steps(10)}
.sj-pts{font-size:13px;color:var(--y2);text-shadow:2px 2px 0 var(--g0)}
.sj-fila.listo .sj-pts::after{content:' ✔';color:var(--g4)}

/* ── podio: plata · oro · bronce ── */
.podio{display:flex;align-items:flex-end;justify-content:center;gap:10px;width:min(460px,100%);
  margin:4px auto 6px}
.pd-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pd-1 canvas.retrato{width:78px;height:78px}
.pd-nom{font-family:'VT323',monospace;font-size:20px;max-width:100%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.pd-pts{font-size:11px;color:var(--y2)}
.pd-base{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  gap:4px;padding-top:8px;border:3px solid var(--bd);border-bottom:0;
  box-shadow:inset 0 4px 0 rgba(255,255,255,.18)}
.pd-base span{font-size:18px;line-height:1}
.pd-base b{font-size:14px;font-weight:400;color:var(--bd)}
.pd-1 .pd-base{height:96px;background:var(--y2)}
.pd-2 .pd-base{height:76px;background:var(--tx3)}
.pd-3 .pd-base{height:62px;background:var(--o3)}
.pd-1 .pd-nom{color:var(--y2)}

/* ── espera, cuenta atrás y final del aprendiz ── */
.sala-esp .tit-id b{color:var(--y2);letter-spacing:3px}
.puntos-anim i{font-style:normal;animation:blink 1.2s steps(2) infinite}
.puntos-anim i:nth-child(2){animation-delay:.2s}
.puntos-anim i:nth-child(3){animation-delay:.4s}
.sala-cuenta{font-size:clamp(64px,28vw,140px);line-height:1;color:var(--y2);
  text-shadow:6px 6px 0 var(--g0)}
.sala-cuenta.late{animation:sala-late .8s steps(6)}
@keyframes sala-late{from{transform:scale(1.6);opacity:.2}to{transform:none;opacity:1}}

/* ── piel OLED ── */
html.hd .sala-caja,html.hd .sj-carta,html.hd .sj-fila,html.hd .sp-codigo b,
html.hd .sp-reglas>span{border-radius:14px}
html.hd .sp-cap{font-size:11px;font-weight:700}
html.hd .sj-nom,html.hd .pd-nom,html.hd .sp-url,html.hd .sp-estado{font-family:inherit;font-size:15px}
html.hd .sp-codigo{font-weight:800}
html.hd .pd-base{border-radius:12px 12px 0 0}

@media(prefers-reduced-motion:reduce){
  .sj-carta.entra,.sj-fila.entra,.puntos-anim i,.sala-cuenta.late{animation:none}
  .sj-fila,.sj-barra i{transition:none}
}

/* ── APRENDIZ DEL MAPA (sprite, salaui/menus) ──
   Mascota decorativa arriba a la derecha del mapa. Solo en vertical: en
   apaisado el mapa ya va apretado en rejilla y un elemento extra la
   descuadraría. */
.centro.mapa{position:relative}
.mapa-aprendiz{position:absolute;top:-4px;right:2px;width:48px;height:82px;
  image-rendering:pixelated;pointer-events:none;z-index:1}
/* deja sitio al mascota: el título no llega a la esquina derecha */
.centro.mapa>h2{padding:0 54px}
html.apaisado .mapa-aprendiz{display:none}
@media(max-width:360px){.mapa-aprendiz{width:40px;height:68px}}


/* ═══ ARMÓNICO DE PREVISUALIZACIÓN (solo para el design system, no afecta al juego) ═══ */

.pv-grid{display:grid;gap:10px}
