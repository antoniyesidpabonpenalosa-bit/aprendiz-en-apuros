<h1 class="pv-h">🕹 Botones</h1>
<p class="pv-note">Botones con relieve pixel (sombra interior clara arriba, oscura abajo) y hundido al pulsar. Toque mínimo 48px de alto.</p>

<p class="pv-lbl">Primario · secundario · violeta</p>
<div class="pv-row">
  <button class="btn" type="button">▶ JUGAR</button>
  <button class="btn btn2" type="button">← VOLVER</button>
  <button class="btn btn3" type="button">🛒 TIENDA</button>
</div>

<p class="pv-lbl">Rechazo (code review) · compartir</p>
<div class="pv-row">
  <button class="btn" type="button">✔ APROBAR</button>
  <button class="btn-r" type="button">✘ RECHAZAR</button>
  <button class="btn btn-share" type="button">📤 COMPARTIR</button>
</div>

<p class="pv-lbl">Icono · barra superior (idioma / sonido / pausa)</p>
<div class="pv-row">
  <button class="btn btn-ico" type="button">📱 GIRO</button>
  <button id="b-lang" type="button">EN</button>
  <button id="b-snd" type="button">🔊</button>
  <button id="b-pause" type="button">⏸</button>
</div>

<p class="pv-lbl">Comandos Simon (Git)</p>
<div class="simon" style="max-width:360px">
  <button class="cmd c-pull" type="button">GIT PULL</button>
  <button class="cmd c-commit" type="button">GIT COMMIT</button>
  <button class="cmd c-push activo" type="button">GIT PUSH</button>
  <button class="cmd c-deploy" type="button">DEPLOY</button>
  <button class="cmd c-rebase" type="button">GIT REBASE</button>
  <button class="cmd c-stash" type="button">GIT STASH</button>
</div>
