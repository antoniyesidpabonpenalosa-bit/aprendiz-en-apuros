<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- iOS no usa el SVG para "Añadir a pantalla de inicio": sin este PNG
     pone una captura de la página como icono. -->
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="css/estilos.css">
<!-- Las dos fuentes se piden YA, en paralelo con el CSS: si no, el navegador
     no las descubre hasta pintar el primer texto y la portada salía un
     instante en Courier y luego saltaba. `crossorigin` hace falta aunque sean
     del mismo origen: las fuentes se piden en modo CORS y sin él la precarga
     no se aprovecha y se descargan dos veces. -->
<link rel="preload" href="fuentes/press-start-2p.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fuentes/vt323.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<div class="crt"></div>
<div id="fx64"></div>
<div id="app">
  <!-- Fondo de montañas pixeladas. Es puro CSS (polígonos escalonados), no una
       imagen: el juego pesa 200 KB y se abre con doble clic, y así sigue. -->
  <div id="fondo" aria-hidden="true">
    <div class="mte m3"></div>
    <div class="mte m2"></div>
    <div class="mte m1"></div>
    <div class="niebla"></div>
  </div>
  <div id="hud">
    <!-- hud() lo rellena en cuanto arranca el JS; aquí va lo que muestra la
         primera pantalla, no un número de días que ya no es el que hay. -->
    <span id="h-nivel">SENA</span>
    <span id="h-estrellas"></span>
    <span id="h-pts">0000</span>
    <span id="h-vidas">♥♥♥</span>
    <button id="b-lang" class="b-sys b-lang" type="button" aria-label="idioma">EN</button>
    <button id="b-snd" class="b-sys b-snd" type="button" aria-label="sonido">♪</button>
    <button id="b-pause" class="b-sys b-pause" type="button" aria-label="pausa">Ⅱ</button>
  </div>
  <div id="screen"></div>
  <!-- Diálogo de verdad: con role/aria-modal y el foco dentro (lo mueve
       principal.js), para que no se pueda tabular por detrás del overlay. -->
  <div id="pausa" class="overlay" role="dialog" aria-modal="true" aria-labelledby="p-titulo" hidden>
    <div class="menu-inner">
      <h2 id="p-titulo">PAUSA</h2>
      <button class="btn" id="p-cont" type="button">CONTINUAR</button>
      <button class="btn btn2" id="p-mapa" type="button">SALIR AL MAPA</button>
    </div>
  </div>
  <!-- Regiones "live": sin esto un lector de pantalla no anuncia nada cuando
       salta un logro o una interrupción. El logro es informativo (polite,
       espera turno); la interrupción corta la partida, así que va assertive. -->
  <div id="logro-popup" role="status" aria-live="polite" hidden>
    <span class="ico-l"></span>
    <p></p>
  </div>
  <div id="interrupcion" role="alert" aria-live="assertive" hidden><p></p></div>
</div>
<script src="js/datos.js"></script>
<script src="js/estado.js"></script>
<script src="js/reto.js"></script>
<script src="js/ranking.js"></script>
<script src="js/audio.js"></script>
<script src="js/sprite.js"></script>
<script src="js/graficos.js"></script>
<script src="js/entrada.js"></script>
<script src="js/nucleo.js"></script>
<script src="js/menus.js"></script>
<script src="js/retoui.js"></script>
<script src="js/minijuegos.js"></script>
<script src="js/jefe.js"></script>
<script src="js/modos.js"></script>
<script src="js/sala.js"></script>
<script src="js/salaui.js"></script>
<script src="js/principal.js"></script>
</body>
</html>
